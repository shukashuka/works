<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- ============================================================
  SEO TAGS — edit the values below.
  See README.md > "SEO" for a full explanation of each tag.
============================================================= -->
<title>Andy — Portfolio</title>
<meta name="description" content="Write a 1-2 sentence description of you and your work here.">
<meta name="keywords" content="portfolio, design, your name, other keywords">
<meta name="author" content="Andy">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://shukashuka.github.io/">

<!-- Open Graph (Facebook, LinkedIn, WhatsApp preview) -->
<meta property="og:type" content="website">
<meta property="og:title" content="Andy — Portfolio">
<meta property="og:description" content="Write a short description of you and your work here.">
<meta property="og:image" content="https://shukashuka.github.io/images/background/topbg.jpg">
<meta property="og:url" content="https://shukashuka.github.io/">

<!-- Twitter / X card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Andy — Portfolio">
<meta name="twitter:description" content="Write a short description of you and your work here.">
<meta name="twitter:image" content="https://shukashuka.github.io/images/background/topbg.jpg">

<!-- JSON-LD structured data, helps Google understand this is a personal site -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Andy",
  "url": "https://shukashuka.github.io/",
  "jobTitle": "Designer",
  "sameAs": []
}
</script>
<!-- ============================================================ -->

<link rel="icon" href="data:,">

<!-- Modular stylesheets — each file owns one part of the design -->
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/hero.css">
<link rel="stylesheet" href="css/projects.css">
<link rel="stylesheet" href="css/profile.css">
<link rel="stylesheet" href="css/overlay.css">
<link rel="stylesheet" href="css/dot-nav.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<canvas id="bg-3d"></canvas>

<!-- Right-side dot navigation: jump to top / middle / bottom -->
<nav id="dot-nav" class="dot-nav" aria-label="Section navigation">
  <button class="dot" data-target="panel-hero" aria-label="Top"></button>
  <button class="dot" data-target="panel-projects" aria-label="Middle"></button>
  <button class="dot" data-target="panel-profile" aria-label="Bottom"></button>
</nav>

<div id="fullpage-container">

  <!-- ===================== SECTION 1 — HERO ===================== -->
  <section class="panel" id="panel-hero" data-bg="images/background/topbg.jpg">
    <div class="hero-grid">
      <div class="hero-left">
        <!-- Logo slot: drop your logo file in images/logo/ and set its src below -->
        <img id="logo-slot" class="logo-slot" src="images/logo/logo.png" alt="Logo"
             onerror="this.style.display='none'">
        <h1 id="hero-heading">Hi, I'm<br>Andy.</h1>
        <p id="hero-sub" class="lede">Short introduction about your design work goes here. Edit this in index.html, search for id="hero-sub".</p>
      </div>
      <div class="hero-right">
        <!-- Slot for animation / 3D model / photo. Replace this div's content with
             an <img>, a <video>, or a 3D embed — see README.md > "Hero visual slot". -->
        <div id="hero-visual-slot" class="hero-visual-slot">
          <span class="slot-hint">3D animation / photo slot</span>
        </div>
      </div>
    </div>
    <div class="scroll-hint">scroll ↓</div>
  </section>

  <!-- ===================== SECTION 2 — PROJECTS ===================== -->
  <section class="panel" id="panel-projects" data-bg="images/background/midbg.jpg">
    <h2 class="panel-title">Projects</h2>
    <div id="projects-grid" class="projects-grid">
      <p class="loading-note">Loading project list…</p>
    </div>
  </section>

  <!-- ===================== SECTION 3 — PROFILE ===================== -->
  <section class="panel" id="panel-profile" data-bg="images/background/botbg.jpg">
    <h2 class="panel-title">Profile</h2>
    <div id="profile-content" class="profile-grid"></div>
  </section>

</div>

<!-- Project gallery overlay (opens when a project card is clicked) -->
<div id="project-overlay" class="overlay">
  <button id="overlay-close" class="overlay-close" aria-label="Close">&times;</button>
  <h3 id="overlay-title"></h3>
  <div id="overlay-grid" class="overlay-grid"></div>
</div>

<!-- Lightbox: enlarges a single photo from the overlay -->
<div id="lightbox" class="lightbox">
  <button id="lightbox-close" class="overlay-close" aria-label="Close">&times;</button>
  <img id="lightbox-img" src="" alt="">
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<!-- Modular scripts — load order matters: config first, main.js last -->
<script src="js/config.js"></script>
<script src="js/panel-backgrounds.js"></script>
<script src="js/animated-background-3d.js"></script>
<script src="js/fullpage-scroll.js"></script>
<script src="js/skills-infographic.js"></script>
<script src="js/profile-section.js"></script>
<script src="js/projects-loader.js"></script>
<script src="js/gallery-overlay.js"></script>
<script src="js/main.js"></script>
</body>
</html>
